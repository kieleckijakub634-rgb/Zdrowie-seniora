<section class="vf-public-shell vf-page section-wrap" data-page="kontakt">
  <a class="vf-back-link" href="#/" data-route="home">← Wróć na stronę główną</a>
  <h1>Kontakt</h1>
  <p>Masz pytanie o VitalFly, płatności lub konto? Napisz do nas przez formularz.</p>
  <form id="contactForm" class="vf-form-card" onsubmit="handleContact(event)">
    <label class="form-label" for="contact-name">Imię i nazwisko</label>
    <input id="contact-name" class="form-input" name="name" autocomplete="name" required />
    <label class="form-label" for="contact-email">Adres e-mail</label>
    <input id="contact-email" class="form-input" name="email" type="email" autocomplete="email" required />
    <label class="form-label" for="contact-message">Wiadomość</label>
    <textarea id="contact-message" class="form-input" name="message" rows="6" required></textarea>
    <button class="btn-cta btn-send" type="submit">Wyślij wiadomość</button>
  </form>
  <div id="contactSuccess" class="vf-success-box" style="display:none;">Dziękujemy. Wiadomość została przyjęta lokalnie. Podłącz backend formularza, aby wysyłać ją na skrzynkę.</div>
</section>
